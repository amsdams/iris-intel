plugins {
    id 'com.android.application'
}

android {
    namespace = 'io.github.amsdams.iris'
    compileSdk = 36
    buildToolsVersion = '36.0.0'
    enableKotlin = false

    defaultConfig {
        applicationId = 'io.github.amsdams.iris'
        minSdk = 26
        targetSdk = 36
        versionCode = Integer.parseInt(System.getenv('IRIS_ANDROID_VERSION_CODE') ?: '16')
        versionName = '0.6.1-alpha' + (System.getenv('IRIS_ANDROID_BUILD_SHA') ? '+' + System.getenv('IRIS_ANDROID_BUILD_SHA') : '')
        resValue 'string', 'spike_version', versionName
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    buildFeatures {
        resValues = true
    }

    signingConfigs {
        if (System.getenv('IRIS_ANDROID_KEYSTORE')) {
            release {
                storeFile = file(System.getenv('IRIS_ANDROID_KEYSTORE'))
                storePassword = System.getenv('IRIS_ANDROID_STORE_PASSWORD')
                keyAlias = System.getenv('IRIS_ANDROID_KEY_ALIAS')
                keyPassword = System.getenv('IRIS_ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv('IRIS_ANDROID_KEYSTORE')) signingConfig = signingConfigs.release
        }
    }

    lint {
        warningsAsErrors = true
        // Keep SDK and toolchain upgrades under maintainer review.
        disable 'OldTargetApi', 'AndroidGradlePluginVersion'
    }
}

abstract class PrepareIrisAssets extends Exec {
    @OutputDirectory
    abstract DirectoryProperty getAssetDirectory()
}

def repositoryRoot = rootProject.projectDir.parentFile.parentFile
def prepareIrisAssets = tasks.register('prepareIrisAssets', PrepareIrisAssets) {
    assetDirectory.set(layout.buildDirectory.dir('generated/iris-assets'))
    workingDir repositoryRoot
    commandLine 'node', 'scripts/prepare-android-assets.mjs'
    doFirst {
        args assetDirectory.get().asFile.absolutePath
    }
    inputs.files fileTree(new File(repositoryRoot, 'apps/iitc-iris/src'))
    inputs.files fileTree(new File(repositoryRoot, 'apps/iitc-iris/assets'))
    inputs.files fileTree(new File(repositoryRoot, 'packages/iitc-core/src'))
    inputs.property 'reuseWebBuild', System.getenv('IRIS_REUSE_WEB_BUILD') ?: '0'
    inputs.files new File(repositoryRoot, 'package.json'),
            new File(repositoryRoot, 'package-lock.json'),
            new File(repositoryRoot, 'node_modules/.package-lock.json'),
            new File(repositoryRoot, 'tsconfig.json'),
            new File(repositoryRoot, 'apps/iitc-iris/tsconfig.json'),
            new File(repositoryRoot, 'packages/iitc-core/tsconfig.json'),
            new File(repositoryRoot, 'LICENSE'),
            new File(repositoryRoot, 'CREDITS.md'),
            new File(repositoryRoot, 'packages/iitc-core/package.json'),
            new File(repositoryRoot, 'apps/iitc-iris/manifest.json'),
            new File(repositoryRoot, 'scripts/web-build.mjs'),
            new File(repositoryRoot, 'apps/iitc-iris/package.json'),
            new File(repositoryRoot, 'apps/iitc-iris/vite.config.ts'),
            new File(repositoryRoot, 'apps/iitc-iris/vite.page-map.config.ts'),
            new File(repositoryRoot, 'apps/iitc-iris/copy-assets.cjs'),
            new File(repositoryRoot, 'scripts/prepare-android-assets.mjs')
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets.addGeneratedSourceDirectory(prepareIrisAssets) { it.assetDirectory }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
