plugins {
    id 'com.android.application'
}

android {
    namespace 'org.iris.intelspike'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'org.iris.intelspike'
        minSdk 26
        targetSdk 36
        versionCode 7
        versionName '0.3.1-spike'
        resValue 'string', 'spike_version', versionName
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/iris-assets')

    lint {
        warningsAsErrors true
        // Intentional API 36/toolchain pins for this disposable proof, not automatic upgrade gates.
        disable 'OldTargetApi', 'AndroidGradlePluginVersion'
    }
}

def repositoryRoot = rootProject.projectDir.parentFile.parentFile
def prepareIrisAssets = tasks.register('prepareIrisAssets', Exec) {
    workingDir repositoryRoot
    commandLine 'node', 'scripts/prepare-android-assets.mjs'
    inputs.files fileTree(new File(repositoryRoot, 'apps/iitc-iris/src'))
    inputs.files fileTree(new File(repositoryRoot, 'apps/iitc-iris/assets'))
    inputs.files fileTree(new File(repositoryRoot, 'packages/iitc-core/src'))
    inputs.files new File(repositoryRoot, 'package-lock.json'),
            new File(repositoryRoot, 'apps/iitc-iris/package.json'),
            new File(repositoryRoot, 'apps/iitc-iris/vite.config.ts'),
            new File(repositoryRoot, 'apps/iitc-iris/vite.page-map.config.ts'),
            new File(repositoryRoot, 'apps/iitc-iris/copy-assets.cjs'),
            new File(repositoryRoot, 'scripts/prepare-android-assets.mjs')
    outputs.dir layout.buildDirectory.dir('generated/iris-assets')
}
tasks.named('preBuild').configure { dependsOn prepareIrisAssets }

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
