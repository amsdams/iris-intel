name: Release IITC IRIS

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Verify tag and source versions before either build
        run: node scripts/verify-release.mjs
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  android:
    needs: validate
    uses: ./.github/workflows/android.yml
    with:
      signed: true
      ref: ${{ needs.validate.outputs.sha }}
      release-tag: ${{ inputs.tag || github.ref_name }}
    secrets:
      ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}

  release:
    needs: [validate, android]
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check workspaces, CSS, and workbench
        run: npm run check

      - name: Build IITC IRIS release artifacts
        run: npm run package

      - name: Prepare artifacts
        run: |
          mkdir -p out
          VERSION=$(node -p "require('./apps/iitc-iris/package.json').version")
          cp apps/iitc-iris/builds/iitc-iris-chrome-${VERSION}-*.zip out/iitc-iris-chrome-${VERSION}.zip
          cp apps/iitc-iris/builds/iitc-iris-firefox-${VERSION}-*.xpi out/iitc-iris-firefox-${VERSION}.xpi

      - name: Download verified signed APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: iitc-iris-android
          path: out/

      - name: Name versioned APK
        run: mv out/iitc-iris-android.apk "out/iitc-iris-android-${RELEASE_TAG#v}.apk"

      - name: Publish tagged release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: IITC IRIS ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
