name: Release IITC IRIS

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (vX.Y.Z)
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  android:
    uses: ./.github/workflows/android.yml
    with:
      signed: true
      ref: refs/tags/${{ inputs.tag || github.ref_name }}
    secrets:
      ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}

  release:
    needs: android
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Select an existing version tag in vX.Y.Z format."
            exit 1
          fi
          TAG_VERSION="${RELEASE_TAG#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          APP_VERSION=$(node -p "require('./apps/iitc-iris/package.json').version")
          MANIFEST_VERSION=$(node -p "require('./apps/iitc-iris/manifest.json').version")
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ] || [ "$TAG_VERSION" != "$APP_VERSION" ] || [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Tag, root package, app package, and manifest versions must match; use npm run version:bump before tagging."
            exit 1
          fi

      - name: Check workspaces, CSS, and workbench
        run: npm run check

      - name: Build IITC IRIS release artifacts
        run: npm run package

      - name: Prepare artifacts
        run: |
          mkdir -p out
          VERSION=$(node -p "require('./apps/iitc-iris/package.json').version")
          cp apps/iitc-iris/builds/iitc-iris-chrome-${VERSION}-*.zip out/iitc-iris-chrome-${VERSION}.zip
          cp apps/iitc-iris/builds/iitc-iris-firefox-${VERSION}-*.xpi out/iitc-iris-firefox-${VERSION}.xpi

      - name: Download verified signed APK
        uses: actions/download-artifact@v4
        with:
          name: iitc-iris-android
          path: out/

      - name: Name versioned APK
        run: mv out/iitc-iris-android.apk "out/iitc-iris-android-${RELEASE_TAG#v}.apk"

      - name: Publish tagged release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: IITC IRIS ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
