name: Release IITC IRIS Extension

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          APP_VERSION=$(node -p "require('./apps/iitc-iris/package.json').version")
          MANIFEST_VERSION=$(node -p "require('./apps/iitc-iris/manifest.json').version")
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ] || [ "$TAG_VERSION" != "$APP_VERSION" ] || [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Tag, root package, app package, and manifest versions must match; use npm run version:bump before tagging."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build IITC IRIS release artifacts
        run: npm run release:all

      - name: Prepare artifacts
        run: |
          mkdir -p out
          VERSION=$(node -p "require('./apps/iitc-iris/package.json').version")
          cp apps/iitc-iris/builds/iitc-iris-chrome-${VERSION}-*.zip out/iitc-iris-chrome-${VERSION}.zip
          cp apps/iitc-iris/builds/iitc-iris-firefox-${VERSION}-*.xpi out/iitc-iris-firefox-${VERSION}.xpi

      - name: Publish tagged release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: IITC IRIS ${{ github.ref_name }}
          generate_release_notes: true
          files: out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
