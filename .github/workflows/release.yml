name: Release IITC IRIS

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Older release tags may predate .nvmrc.
          node-version: ${{ hashFiles('.nvmrc') == '' && '24' || '' }}
          node-version-file: .nvmrc
      - name: Verify tag and source versions before either build
        run: node scripts/verify-release.mjs
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  android:
    needs: validate
    uses: ./.github/workflows/android.yml
    with:
      signed: true
      ref: ${{ needs.validate.outputs.sha }}
      release-tag: ${{ inputs.tag || github.ref_name }}
    secrets:
      ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}

  release:
    needs: [validate, android]
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ hashFiles('.nvmrc') == '' && '24' || '' }}
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check workspaces, CSS, and workbench
        run: npm run check

      - name: Ensure Chrome is available
        run: google-chrome --version || npx playwright install --with-deps chrome

      - name: Browser smoke (build web assets once)
        run: npm run test:browser:smoke

      - name: Package verified web assets
        run: npm run package:reuse

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-smoke-failure
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare artifacts
        run: |
          mkdir -p out
          VERSION=$(node -p "require('./apps/iitc-iris/package.json').version")
          cp apps/iitc-iris/builds/iitc-iris-chrome-${VERSION}-*.zip out/iitc-iris-chrome-${VERSION}.zip
          cp apps/iitc-iris/builds/iitc-iris-firefox-${VERSION}-*.xpi out/iitc-iris-firefox-${VERSION}.xpi

      - name: Download verified signed APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: iitc-iris-android
          path: out/

      - name: Name versioned APK
        run: mv out/iitc-iris-android.apk "out/iitc-iris-android-${RELEASE_TAG#v}.apk"

      - name: Publish tagged release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: IITC IRIS ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
