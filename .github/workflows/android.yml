name: Build Android APK

on:
  workflow_call:
    inputs:
      signed:
        type: boolean
        default: false
      ref:
        type: string
        default: ''
      release-tag:
        type: string
        default: ''
    secrets:
      ANDROID_SIGNING_KEYSTORE_BASE64:
        required: false
      ANDROID_SIGNING_STORE_PASSWORD:
        required: false
      ANDROID_SIGNING_KEY_ALIAS:
        required: false
      ANDROID_SIGNING_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Restrict release signing to main and version-tag workflows
        if: ${{ inputs.signed }}
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_REF: ${{ github.ref }}
        shell: bash
        run: |
          case "$TRIGGER_EVENT:$TRIGGER_REF" in
            push:refs/heads/main|workflow_dispatch:refs/heads/main|push:refs/tags/v*|workflow_dispatch:refs/tags/v*) ;;
            *) echo '::error::Release signing is restricted to main and version-tag push/manual workflows.'; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Locate Android project in the checked-out revision
        run: |
          project=apps/android
          # Manual releases can check out tags created before the directory rename.
          if [ ! -f "$project/settings.gradle" ]; then
            project=apps/android-intel-spike
          fi
          test -f "$project/settings.gradle"
          echo "ANDROID_PROJECT_DIR=$project" >> "$GITHUB_ENV"
          java_version=21
          if [ -f "$project/.java-version" ]; then
            java_version=$(cat "$project/.java-version")
          fi
          echo "ANDROID_JAVA_VERSION=$java_version" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Older release tags may predate .nvmrc.
          node-version: ${{ hashFiles('.nvmrc') == '' && '24' || '' }}
          node-version-file: .nvmrc
          cache: npm

      - name: Verify source versions before restoring signing material
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: node scripts/verify-release.mjs

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ env.ANDROID_JAVA_VERSION }}
          cache: gradle
          cache-dependency-path: |
            ${{ env.ANDROID_PROJECT_DIR }}/**/*.gradle*
            ${{ env.ANDROID_PROJECT_DIR }}/**/gradle-wrapper.properties
            ${{ env.ANDROID_PROJECT_DIR }}/gradle.properties
            ${{ env.ANDROID_PROJECT_DIR }}/.java-version

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install pinned Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install dependencies
        run: npm ci

      - name: Check Android debug build without signing secrets
        if: ${{ !inputs.signed }}
        run: npm run android:check

      - name: Restore release keystore
        if: ${{ inputs.signed }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        shell: python
        run: |
          import base64, os
          from pathlib import Path
          encoded = os.environ.get('KEYSTORE_BASE64', '')
          if not encoded:
              raise SystemExit('Configure ANDROID_SIGNING_KEYSTORE_BASE64 before publishing APKs.')
          path = Path(os.environ['RUNNER_TEMP']) / 'iris-release.keystore'
          path.write_bytes(base64.b64decode(encoded, validate=True))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'IRIS_ANDROID_KEYSTORE={path}\n')

      - name: Test, lint and build signed release APK
        if: ${{ inputs.signed }}
        env:
          IRIS_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          IRIS_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          IRIS_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: npm run android:release

      - name: Verify and prepare APK
        env:
          SIGNED: ${{ inputs.signed }}
        run: |
          mkdir -p out
          if [ "$SIGNED" = 'true' ]; then
            APK="$ANDROID_PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          else
            APK="$ANDROID_PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          if [ "$SIGNED" = 'true' ]; then
            CERTIFICATE=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            test "$CERTIFICATE" = "$(cat "$ANDROID_PROJECT_DIR/release-certificate.sha256")"
          fi
          cp "$APK" out/iitc-iris-android.apk
          if [ "$SIGNED" = 'true' ]; then
            node scripts/write-android-update.mjs "$ANDROID_PROJECT_DIR/app/build/outputs/apk/release/output-metadata.json" out/iitc-iris-android-update.properties
          fi

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iitc-iris-android
          path: out/
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing key
        if: ${{ always() }}
        shell: python
        run: |
          import os
          from pathlib import Path
          (Path(os.environ['RUNNER_TEMP']) / 'iris-release.keystore').unlink(missing_ok=True)
