name: Build Android APK

on:
  workflow_call:
    inputs:
      signed:
        type: boolean
        default: false
      ref:
        type: string
        default: ''
      release-tag:
        type: string
        default: ''
    secrets:
      ANDROID_SIGNING_KEYSTORE_BASE64:
        required: false
      ANDROID_SIGNING_STORE_PASSWORD:
        required: false
      ANDROID_SIGNING_KEY_ALIAS:
        required: false
      ANDROID_SIGNING_KEY_PASSWORD:
        required: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Restrict release signing to main and version-tag workflows
        if: ${{ inputs.signed }}
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_REF: ${{ github.ref }}
        shell: bash
        run: |
          case "$TRIGGER_EVENT:$TRIGGER_REF" in
            push:refs/heads/main|workflow_dispatch:refs/heads/main|push:refs/tags/v*|workflow_dispatch:refs/tags/v*) ;;
            *) echo '::error::Release signing is restricted to main and version-tag push/manual workflows.'; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Verify source versions before restoring signing material
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: node scripts/verify-release.mjs

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install pinned Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install dependencies
        run: npm ci

      - name: Check Android debug build without signing secrets
        if: ${{ !inputs.signed }}
        run: npm run android:check

      - name: Restore release keystore
        if: ${{ inputs.signed }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        shell: python
        run: |
          import base64, os
          from pathlib import Path
          encoded = os.environ.get('KEYSTORE_BASE64', '')
          if not encoded:
              raise SystemExit('Configure ANDROID_SIGNING_KEYSTORE_BASE64 before publishing APKs.')
          path = Path(os.environ['RUNNER_TEMP']) / 'iris-release.keystore'
          path.write_bytes(base64.b64decode(encoded, validate=True))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'IRIS_ANDROID_KEYSTORE={path}\n')

      - name: Test, lint and build signed release APK
        if: ${{ inputs.signed }}
        env:
          IRIS_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          IRIS_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          IRIS_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: npm run android:release

      - name: Verify and prepare APK
        env:
          SIGNED: ${{ inputs.signed }}
        run: |
          mkdir -p out
          if [ "$SIGNED" = 'true' ]; then
            APK=apps/android-intel-spike/app/build/outputs/apk/release/app-release.apk
          else
            APK=apps/android-intel-spike/app/build/outputs/apk/debug/app-debug.apk
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          if [ "$SIGNED" = 'true' ]; then
            CERTIFICATE=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            test "$CERTIFICATE" = "$(cat apps/android-intel-spike/release-certificate.sha256)"
          fi
          cp "$APK" out/iitc-iris-android.apk
          if [ "$SIGNED" = 'true' ]; then
            node scripts/write-android-update.mjs apps/android-intel-spike/app/build/outputs/apk/release/output-metadata.json out/iitc-iris-android-update.properties
          fi

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iitc-iris-android
          path: out/
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing key
        if: ${{ always() }}
        shell: python
        run: |
          import os
          from pathlib import Path
          (Path(os.environ['RUNNER_TEMP']) / 'iris-release.keystore').unlink(missing_ok=True)
