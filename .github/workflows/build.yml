name: Build IITC IRIS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Verify source versions before building or signing
        run: node scripts/verify-release.mjs
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check workspaces, CSS, and workbench
        run: npm run check

      - name: Package IITC IRIS
        run: npm run package

      - name: Prepare artifacts
        run: |
          mkdir -p out
          # Use stable names for the automated latest release
          cp apps/iitc-iris/builds/iitc-iris-chrome-*.zip out/iitc-iris-chrome.zip
          cp apps/iitc-iris/builds/iitc-iris-firefox-*.xpi out/iitc-iris-firefox.xpi

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iitc-iris-artifacts
          path: out/
          retention-days: 30

  android-unsigned:
    if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
    needs: validate
    uses: ./.github/workflows/android.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}
      signed: false
    # No signing secrets are passed to PR or non-main builds.

  android-signed:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    uses: ./.github/workflows/android.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}
      signed: true
    secrets:
      ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}

  publish-latest:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build, android-signed]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified extension packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: iitc-iris-artifacts
          path: out/

      - name: Download verified signed APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: iitc-iris-android
          path: out/

      - name: Create/Update Latest Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: latest
          name: Latest Build
          make_latest: true
          prerelease: true
          body: |
            Automated build from commit ${{ github.sha }}

            IITC IRIS browser-extension packages and a signed Android test APK.

            ### IITC IRIS (Alpha)
            IITC-compatible port with Leaflet.
            - Chrome: `iitc-iris-chrome.zip`
            - Firefox: `iitc-iris-firefox.xpi`
            - Android sideload: `iitc-iris-android.apk` (Android 8.0+, experimental WebView wrapper)

            ---
            **Installation Instructions:**
            Refer to the [README](https://github.com/${{ github.repository }}#load-iitc-iris-locally) for extension installation instructions.
            Android: see the [friends testing guide](https://github.com/${{ github.repository }}/blob/main/docs/iitc-iris/friends-testing.md).
            In IRIS, use **App → Check for updates** or **App → Releases** for future APKs.
          files: out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
